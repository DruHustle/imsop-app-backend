services:
  - type: web
    name: imsop-backend-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/Gateway.Dockerfile
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://imsop-app.vercel.app
      - key: NODE_API_URL
        fromService:
          type: pserv
          name: imsop-node-api
          property: hostport
      - key: OPERATIONS_SERVICE_URL
        fromService:
          type: pserv
          name: imsop-operations-service
          property: hostport
      - key: SUPPLY_CHAIN_SERVICE_URL
        fromService:
          type: pserv
          name: imsop-supply-chain-service
          property: hostport

  - type: pserv
    name: imsop-node-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    dockerCommand: /bin/sh -c "node dist/migrate.js && node dist/index.js"
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://imsop-app.vercel.app
      - key: PASSWORD_RESET_BASE_URL
        value: https://imsop-app.vercel.app/#/reset-password
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GMAIL_FROM
        value: notifications.imsop@gmail.com
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LOGISTICS_WEBHOOK_SECRETS
        sync: false

  - type: pserv
    name: imsop-operations-service
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/OperationsService.Dockerfile
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: JWT_SECRET
        fromService:
          type: pserv
          name: imsop-node-api
          envVarKey: JWT_SECRET
      - key: CORS_ALLOWED_ORIGINS
        value: https://imsop-app.vercel.app

  - type: pserv
    name: imsop-supply-chain-service
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./infrastructure/docker/SupplyChainService.Dockerfile
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: JWT_SECRET
        fromService:
          type: pserv
          name: imsop-node-api
          envVarKey: JWT_SECRET
      - key: CORS_ALLOWED_ORIGINS
        value: https://imsop-app.vercel.app
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: imsop-supply-chain-db
          property: connectionString
      - key: Database__AutoEnsureCreated
        value: "true"
      - key: ServiceBus__Enabled
        value: "false"

databases:
  - name: imsop-supply-chain-db
    databaseName: imsop_supply_chain
    user: imsop_supply_chain
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 5
    storageAutoscalingEnabled: true
    ipAllowList: []
