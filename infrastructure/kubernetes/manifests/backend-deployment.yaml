apiVersion: apps/v1
kind: Deployment
metadata:
  name: imsop-backend
  namespace: imsop
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: imsop-backend
  template:
    metadata:
      labels:
        app: imsop-backend
    spec:
      containers:
      - name: backend
        image: druhustle/imsop-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: postgres-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: jwt-secret
        - name: NODE_ENV
          value: production
        - name: ALLOWED_ORIGIN
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: allowed-origin
        - name: LOGISTICS_WEBHOOK_SECRETS
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: logistics-webhook-secrets
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: imsop-backend-service
  namespace: imsop
spec:
  selector:
    app: imsop-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: LoadBalancer
