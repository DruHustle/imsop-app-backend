name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Dependencies
        run: dotnet restore src/IMSOP.sln

      - name: Build Solution
        run: dotnet build src/IMSOP.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test src/IMSOP.sln --no-build --verbosity normal --configuration Release

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Verify Node API before publishing production images
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

  docker-build-push:
    name: Docker Build and Push
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: IMSOP.Gateway
            image: imsop-gateway
            dockerfile: infrastructure/docker/Gateway.Dockerfile
            context: .
          - service: IMSOP.OperationsService
            image: imsop-operationsservice
            dockerfile: infrastructure/docker/OperationsService.Dockerfile
            context: .
          - service: IMSOP.SupplyChainService
            image: imsop-supplychainservice
            dockerfile: infrastructure/docker/SupplyChainService.Dockerfile
            context: .
          - service: IMSOP.NodeApi
            image: imsop-node-api
            dockerfile: server/Dockerfile
            context: ./server
          - service: IMSOP.RenderBundle
            image: imsop-backend
            dockerfile: infrastructure/render/Dockerfile
            context: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve GHCR image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
